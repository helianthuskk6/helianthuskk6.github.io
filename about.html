<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于我 - 我的个人空间</title>
  <meta name="description" content="了解我的故事、背景与成长轨迹。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span id="brand-name">我的个人空间</span>
      </a>
      <nav id="site-nav"></nav>
      <button id="theme-toggle" class="icon-btn" aria-label="切换深色模式"></button>
      <button id="nav-toggle" class="icon-btn nav-toggle" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>关于我</h1>
        <p>了解我的故事</p>
      </div>
    </section>

    <section class="section">
      <div class="container about-grid">
        <div class="about-card reveal">
          <img class="about-avatar js-avatar" src="assets/avatar.svg" alt="头像">
          <h2 id="about-intro"></h2>
        </div>
        <div class="about-card reveal">
          <h3>基本信息</h3>
          <div class="facts-grid" id="about-facts"></div>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container reveal">
        <h2 class="section-title">我的背景</h2>
        <p class="prose" id="about-background"></p>
      </div>
    </section>

    <section class="section">
      <div class="container reveal">
        <h2 class="section-title">成长时间线</h2>
        <ol class="timeline" id="about-timeline"></ol>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container reveal">
        <h2 class="section-title">找到我</h2>
        <div class="social-links social-links-large js-social"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container" id="footer-text"></div>
  </footer>

  <div id="config-error" hidden></div>
  <script src="js/markdown.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
