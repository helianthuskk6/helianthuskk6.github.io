<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 - 我的个人空间</title>
  <meta name="description" content="博客文章详情">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span id="brand-name">我的个人空间</span>
      </a>
      <nav id="site-nav"></nav>
      <button id="theme-toggle" class="icon-btn" aria-label="切换深色模式"></button>
      <button id="nav-toggle" class="icon-btn nav-toggle" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="section section-post">
      <div class="container">
        <a class="back-link" href="blog.html">← 返回博客</a>
        <article class="post-article reveal">
          <header class="post-header">
            <h1 id="post-title"></h1>
            <div class="post-meta">
              <time id="post-date"></time>
              <span id="post-tags"></span>
            </div>
          </header>
          <div class="post-content" id="post-content"></div>
        </article>
        <nav class="post-nav" id="post-nav"></nav>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container" id="footer-text"></div>
  </footer>

  <div id="config-error" hidden></div>
  <script src="js/markdown.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
